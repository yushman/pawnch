schema: pawnch

context: |
  pawnch is an Android chess game for kids 6-12 where every capture cuts away to a
  full-screen character duel. Godot 4.3+ / GDScript, Compatibility renderer, Android
  only, landscape only. One developer, two-week sprint.

  Read docs/product-analysis.md (scope and non-goals), docs/system-analysis.md
  (requirements and failure modes) and docs/adr/ (why things are the way they are)
  before proposing behavior. CLAUDE.md is the short version of all three.

  Architecture: InputRouter -> GameSession -> RulesAdapter, with GameSession driving
  BoardView, GreedyBot and ClashDirector -> ClashLibrary -> JuiceBus.

  Hard invariant: a move is committed to GameState the instant it is judged legal,
  before the clash starts. The clash is presentation replaying a settled fact.
  ClashDirector never mutates game state; RulesAdapter knows nothing about rendering
  or timing; JuiceBus never blocks a frame or gates a state transition.

  Budgets: >=50 fps through the clash with no frame over 20 ms, capture-tap to first
  clash frame < 200 ms, total clash <= 2.0 s, cold start to board <= 3.0 s, ~60 draw
  calls, zero network (android.permission.INTERNET must never appear in the manifest).
  Measured on a 2022 mid-range Android, never on a laptop or a flagship.

rules:
  specs:
    - Specify observable behavior only - no implementation details, no file or class names.
    - Where the system-analysis budgets apply, state the number in the scenario instead of "fast" or "smooth".
    - Anything on the non-goals list in docs/product-analysis.md is out of scope; say so rather than specifying it.
  tasks:
    - Keep tasks small enough to check off in one sitting; the sprint is two weeks long.
    - Include the verification step for each task - the perft numbers, the desync test, or the adb command that produces the measurement.
    - End the change with a devlog entry in docs/devlog.md.
